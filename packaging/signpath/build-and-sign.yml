name: Build and Sign (SignPath)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build Native ARM64 & x64
    runs-on: windows-latest
    outputs:
      arm64_artifact_id: ${{ steps.upload_arm64.outputs.artifact-id }}
      x64_artifact_id: ${{ steps.upload_x64.outputs.artifact-id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Native ARM64 Release
        run: |
          dotnet publish src/CRDLightweightARM/CRDLightweightARM.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/win-arm64
          Compress-Archive -Path ./dist/win-arm64/CRDLightweightARM.exe -DestinationPath ./dist/CRD-win-arm64-unsigned.zip

      - name: Publish Native x64 Release
        run: |
          dotnet publish src/CRDLightweightARM/CRDLightweightARM.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/win-x64
          Compress-Archive -Path ./dist/win-x64/CRDLightweightARM.exe -DestinationPath ./dist/CRD-win-x64-unsigned.zip

      - name: Upload Unsigned ARM64 Artifact
        id: upload_arm64
        uses: actions/upload-artifact@v4
        with:
          name: crd-win-arm64-unsigned
          path: ./dist/CRD-win-arm64-unsigned.zip
          retention-days: 5

      - name: Upload Unsigned x64 Artifact
        id: upload_x64
        uses: actions/upload-artifact@v4
        with:
          name: crd-win-x64-unsigned
          path: ./dist/CRD-win-x64-unsigned.zip
          retention-days: 5

  sign:
    name: Sign Binaries with SignPath
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check SignPath Secrets
        id: check_secrets
        shell: pwsh
        run: |
          if ("${{ secrets.SIGNPATH_API_TOKEN }}" -ne "") {
            echo "has_signpath=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "has_signpath=false" >> $env:GITHUB_OUTPUT
            Write-Warning "SIGNPATH_API_TOKEN is not configured in GitHub Secrets. Skipping SignPath signing."
          }

      - name: Sign ARM64 with SignPath
        if: steps.check_secrets.outputs.has_signpath == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.arm64_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: './signed-arm64'

      - name: Sign x64 with SignPath
        if: steps.check_secrets.outputs.has_signpath == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.x64_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: './signed-x64'

      - name: Prepare Release Assets
        id: prep_assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./release-assets -Force
          if (Test-Path "./signed-arm64") {
            Get-ChildItem "./signed-arm64" | Copy-Item -Destination "./release-assets"
          }
          if (Test-Path "./signed-x64") {
            Get-ChildItem "./signed-x64" | Copy-Item -Destination "./release-assets"
          }

          if ((Get-ChildItem ./release-assets).Count -gt 0) {
            Get-FileHash ./release-assets/* -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
            } | Set-Content ./release-assets/SHA256SUMS.txt
          }

      - name: Create GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true) && steps.check_secrets.outputs.has_signpath == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          generate_release_notes: true
