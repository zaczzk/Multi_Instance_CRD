name: Build and Distribute

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release Tag (e.g. v1.0.1 - required if not triggered by git tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Compile Dual-Arch & Build Installers
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Extract Version String
        id: get_version
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = ($env:GITHUB_REF -replace "refs/tags/v", "").Trim()
          } elseif ("${{ github.event.inputs.release_tag }}" -ne "") {
            $ver = ("${{ github.event.inputs.release_tag }}" -replace "^v", "").Trim()
          }
          Write-Host "Configured Version: $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Compile Full (.NET Included) & Light (.NET Excluded) Releases
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          .\build.ps1 -BuildInstallers -Version $ver

      - name: Package Release Assets & Checksums
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./dist-packages -Force
          $ver = "${{ steps.get_version.outputs.version }}"

          # 1. Standalone Portable Zips (.NET Included)
          Copy-Item "Run-CRD.cmd" "./dist/win-arm64/" -Force
          Compress-Archive -Path "./dist/win-arm64/CRDLightweightARM.exe", "./dist/win-arm64/Run-CRD.cmd" `
            -DestinationPath "./dist-packages/Multi_Instance_CRD-v$ver-win-arm64-Standalone.zip" -Force
            
          Copy-Item "Run-CRD.cmd" "./dist/win-x64/" -Force
          Compress-Archive -Path "./dist/win-x64/CRDLightweightARM.exe", "./dist/win-x64/Run-CRD.cmd" `
            -DestinationPath "./dist-packages/Multi_Instance_CRD-v$ver-win-x64-Standalone.zip" -Force

          # 2. Lightweight Portable Zips (.NET Excluded)
          Copy-Item "Run-CRD.cmd" "./dist-light/win-arm64/" -Force
          Compress-Archive -Path "./dist-light/win-arm64/*" `
            -DestinationPath "./dist-packages/Multi_Instance_CRD-v$ver-win-arm64-Lightweight.zip" -Force

          Copy-Item "Run-CRD.cmd" "./dist-light/win-x64/" -Force
          Compress-Archive -Path "./dist-light/win-x64/*" `
            -DestinationPath "./dist-packages/Multi_Instance_CRD-v$ver-win-x64-Lightweight.zip" -Force

          # 3. Windows Installers (Inno Setup)
          if (Test-Path "./dist-installers") {
            Copy-Item "./dist-installers/*.exe" "./dist-packages/" -Force
          }

          # 4. Generate SHA-256 Checksums
          Get-FileHash ./dist-packages/* -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content ./dist-packages/SHA256SUMS.txt

          Write-Host "`nGenerated Distribution Artifacts:" -ForegroundColor Green
          Get-Content ./dist-packages/SHA256SUMS.txt
          Get-ChildItem ./dist-packages/ | Format-Table Name, Length

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CRD-Distribution-Packages
          path: ./dist-packages/*
          retention-days: 14

      - name: Determine Release Eligibility
        id: check_release
        shell: pwsh
        run: |
          $isTag = $env:GITHUB_REF -like "refs/tags/v*"
          $manualRelease = "${{ github.event.inputs.create_release }}" -eq "true"
          if ($isTag -or $manualRelease) {
            echo "should_release=true" >> $env:GITHUB_OUTPUT
            if ($isTag) {
              $tag = $env:GITHUB_REF -replace "refs/tags/", ""
              echo "tag_name=$tag" >> $env:GITHUB_OUTPUT
            } else {
              $inputTag = "${{ github.event.inputs.release_tag }}"
              if (-not $inputTag) {
                $inputTag = "v${{ steps.get_version.outputs.version }}"
              }
              echo "tag_name=$inputTag" >> $env:GITHUB_OUTPUT
            }
          } else {
            echo "should_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag_name }}
          name: Multi_Instance_CRD ${{ steps.check_release.outputs.tag_name }}
          files: ./dist-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
